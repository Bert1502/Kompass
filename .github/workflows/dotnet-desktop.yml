name: .NET

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: build (${{ matrix.configuration }})
    runs-on: windows-latest

    strategy:
      matrix:
        configuration:
          - Debug
          - Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Kompass.sln

      - name: Build
        run: dotnet build Kompass.sln --configuration ${{ matrix.configuration }} --no-restore

      - name: Test
        run: dotnet test Kompass.sln --configuration ${{ matrix.configuration }} --no-build --no-restore
